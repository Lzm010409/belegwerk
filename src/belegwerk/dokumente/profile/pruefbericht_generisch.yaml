# Profil: Pruefbericht, absenderunabhaengig.
# Der Pruefbericht wird in dasselbe Modell ueberfuehrt wie eine Kalkulation —
# nur so laesst sich Position gegen Position vergleichen.
name: pruefbericht_generisch
quelle: PRUEFBERICHT
formate: [pdf, txt]

# Faengt alles, was sich als Pruefbericht zu erkennen gibt, aber keinem
# bekannten Absenderprofil folgt. Bewusst niedriger gewichtet als die
# Absenderprofile, damit diese Vorrang haben.
adapter:
  pdf: pruefbericht_generisch
  txt: pruefbericht_generisch

erkennung:
  mindestpunkte: 3
  signaturen:
    - muster: 'Pruefbericht|Prüfbericht'
      gewicht: 2
    - muster: 'Anerkannte\s+(Ersatzteile|Verrechnungssaetze)'
      gewicht: 2
    - muster: 'Pruefergebnis|Prüfergebnis'
      gewicht: 2
    - muster: 'Kalkulierte\s+Reparaturkosten'
      gewicht: 1

pflichtfelder: [aktenzeichen]

felder:
  aktenzeichen: 'Schadennummer\s{2,}(?P<aktenzeichen>\S+)'
  vin: '(?:Fahrgestellnummer|FIN)\s{2,}(?P<vin>[A-HJ-NPR-Z0-9]{17})'
  kennzeichen: 'Amtl\.?\s*Kennzeichen\s{2,}(?P<kennzeichen>[A-ZÄÖÜ]{1,3}-[A-Z]{1,2}\s?\d{1,4}[EH]?)'

saetze:
  mechanik: 'Lohn\s+Mechanik\s{2,}(?P<wert>[\d.]+,\d{2})'
  karosserie: 'Lohn\s+Karosserie\s{2,}(?P<wert>[\d.]+,\d{2})'
  elektrik: 'Lohn\s+Elektrik\s{2,}(?P<wert>[\d.]+,\d{2})'
  lack_lohn: 'Lohn\s+Lackierung\s{2,}(?P<wert>[\d.]+,\d{2})'
  lack_material_prozent: 'Lackmaterial\s{2,}(?P<wert>[\d.]+,\d)\s*%'
  upe_aufschlag_prozent: 'UPE-Aufschlag\s{2,}(?P<wert>[\d.]+,\d)\s*%'
  verbringung: 'Verbringungskosten\s{2,}(?P<wert>[\d.]+,\d{2})\s*EUR'

summen:
  ersatzteile: 'Summe\s+Ersatzteile\s{2,}(?P<wert>[\d.]+,\d{2})'
  arbeit: 'Summe\s+Arbeitslohn\s{2,}(?P<wert>[\d.]+,\d{2})'
  lack: 'Summe\s+Lackierung\s{2,}(?P<wert>[\d.]+,\d{2})'
  nebenkosten: 'Summe\s+Nebenkosten\s{2,}(?P<wert>[\d.]+,\d{2})'
  netto: 'Summe\s+netto\s{2,}(?P<wert>[\d.]+,\d{2})'
  mehrwertsteuer: 'Mehrwertsteuer\s+[\d.,]+\s*%\s{2,}(?P<wert>[\d.]+,\d{2})'
  brutto: 'Gesamtbetrag\s+brutto\s{2,}(?P<wert>[\d.]+,\d{2})'
  vorgelegt_netto: 'Kalkulierte\s+Reparaturkosten\s+netto\s{2,}(?P<wert>[\d.]+,\d{2})'

abschnitte:
  - art: ERSATZTEIL
    beginn: '^\s*Anerkannte\s+Ersatzteile\s*$'
    ende: '^\s*Summe\s+Ersatzteile'
    zeile: '^\s*(?P<nr>\d{1,3})\s+(?P<teilenummer>[A-Z0-9][A-Z0-9./\-]{4,})\s+(?P<bezeichnung>\D.*?)\s{2,}(?P<einzelpreis>[\d.]+,\d{2})\s{2,}(?P<aufschlag>[\d.]+,\d)\s*%\s{2,}(?P<betrag>[\d.]+,\d{2})\s*$'
  - art: ARBEIT
    beginn: '^\s*Anerkannter\s+Arbeitslohn\s*$'
    ende: '^\s*Summe\s+Arbeitslohn'
    zeile: '^\s*(?P<nr>\d{1,3})\s+(?P<aw>[\d.]+,\d)\s+(?P<bezeichnung>\D.*?)\s{2,}(?P<satz>[\d.]+,\d{2})\s{2,}(?P<betrag>[\d.]+,\d{2})\s*$'
  - art: LACK
    beginn: '^\s*Anerkannte\s+Lackierung\s*$'
    ende: '^\s*Summe\s+Lackierung'
    zeile: '^\s*(?P<nr>\d{1,3})\s+(?P<stufe>\d)\s+(?P<aw>[\d.]+,\d)\s+(?P<bezeichnung>\D.*?)\s{2,}(?P<satz>[\d.]+,\d{2})\s{2,}(?P<betrag>[\d.]+,\d{2})\s*$'
  - art: NEBENKOSTEN
    beginn: '^\s*Anerkannte\s+Nebenkosten\s*$'
    ende: '^\s*Summe\s+Nebenkosten'
    zeile: '^\s*(?P<nr>\d{1,3})\s+(?P<bezeichnung>\D.*?)\s{2,}(?P<betrag>[\d.]+,\d{2})\s*$'
    optional: true
