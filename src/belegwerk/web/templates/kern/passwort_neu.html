{% extends "basis.html" %}
{% block titel %}Neues Passwort — {{ marke }}{% endblock %}
{% block inhalt %}
<div style="max-width:26rem">
  <h1>Neues Passwort</h1>
  {% if fehler %}<div class="meldung meldung-fehler" role="alert"><p>{{ fehler }}</p></div>{% endif %}
  <form method="post" action="/passwort-neu/{{ marke }}" class="karte">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="feld">
      <label for="passwort">Neues Passwort</label>
      <input id="passwort" name="passwort" type="password" required autocomplete="new-password" autofocus>
      <p class="feld-hilfe">Mindestens {{ mindestlaenge }} Zeichen.</p>
    </div>
    <div class="feld">
      <label for="wdh">Wiederholen</label>
      <input id="wdh" name="passwort_wiederholung" type="password" required autocomplete="new-password">
    </div>
    <button class="knopf" type="submit">Passwort setzen</button>
  </form>
</div>
{% endblock %}
